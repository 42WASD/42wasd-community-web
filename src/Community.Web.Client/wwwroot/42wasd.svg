<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" shape-rendering="crispEdges">
  <defs>
    <style>
      .key-main { fill: #C2185B; }
      .key-shadow { fill: #7B0E3A; }
      .text-white { fill: #FFFFFF; }
      .banner-border { fill: #C2185B; }
    </style>
  </defs>

  <!-- ==================== W KEY ==================== -->
  <g id="key-w">
    <!-- Top Face -->
    <rect x="23" y="2" width="18" height="13" class="key-main" />
    <!-- Front Bevel -->
    <rect x="23" y="15" width="18" height="5" class="key-main" />
    <polygon points="24,15 40,15 37,19 27,19" class="key-shadow" />
    <!-- Letter 'W' -->
    <g class="text-white">
      <rect x="27" y="5" width="2" height="5" />
      <rect x="35" y="5" width="2" height="5" />
      <rect x="29" y="9" width="2" height="2" />
      <rect x="33" y="9" width="2" height="2" />
      <rect x="31" y="7" width="2" height="3" />
    </g>
  </g>

  <!-- ==================== A KEY ==================== -->
  <g id="key-a">
    <!-- Top Face -->
    <rect x="3" y="23" width="18" height="13" class="key-main" />
    <!-- Front Bevel -->
    <rect x="3" y="36" width="18" height="5" class="key-main" />
    <polygon points="4,36 20,36 17,40 7,40" class="key-shadow" />
    <!-- Letter 'A' -->
    <g class="text-white">
      <rect x="9" y="26" width="6" height="2" />
      <rect x="8" y="28" width="2" height="5" />
      <rect x="14" y="28" width="2" height="5" />
      <rect x="10" y="29" width="4" height="1" />
    </g>
  </g>

  <!-- ==================== S KEY ==================== -->
  <g id="key-s">
    <!-- Top Face -->
    <rect x="23" y="23" width="18" height="13" class="key-main" />
    <!-- Front Bevel -->
    <rect x="23" y="36" width="18" height="5" class="key-main" />
    <polygon points="24,36 40,36 37,40 27,40" class="key-shadow" />
    <!-- Letter 'S' (Refined Pixel Glyphs) -->
    <g class="text-white">
      <!-- Top Bar -->
      <rect x="30" y="26" width="5" height="1" />
      <!-- Upper Left Spine -->
      <rect x="29" y="26" width="2" height="3" />
      <!-- Middle Bar -->
      <rect x="29" y="29" width="6" height="1" />
      <!-- Lower Right Spine -->
      <rect x="33" y="29" width="2" height="3" />
      <!-- Bottom Bar -->
      <rect x="29" y="32" width="5" height="1" />
    </g>
  </g>

  <!-- ==================== D KEY ==================== -->
  <g id="key-d">
    <!-- Top Face -->
    <rect x="43" y="23" width="18" height="13" class="key-main" />
    <!-- Front Bevel -->
    <rect x="43" y="36" width="18" height="5" class="key-main" />
    <polygon points="44,36 60,36 57,40 47,40" class="key-shadow" />
    <!-- Letter 'D' -->
    <g class="text-white">
      <rect x="47" y="26" width="2" height="7" />
      <rect x="49" y="26" width="4" height="1" />
      <rect x="49" y="32" width="4" height="1" />
      <rect x="52" y="27" width="2" height="5" />
    </g>
  </g>

  <!-- ==================== GAMEDEV BANNER ==================== -->
  <g id="banner-gamedev">
    <!-- Banner Silhouette -->
    <path class="banner-border" d="
      M 3,44 H 61 V 54 H 49 V 63 H 15 V 54 H 3 Z
      M 1,46 H 63 V 52 H 1 Z
      M 17,53 H 47 V 64 H 17 Z
    " />

    <!-- GAMEDEV Letters (White) -->
    <!-- G -->
    <g class="text-white">
      <rect x="4" y="46" width="6" height="6" />
      <rect x="6" y="48" width="2" height="2" fill="#C2185B" />
      <rect x="8" y="48" width="2" height="1" fill="#C2185B" />
    </g>

    <!-- A -->
    <g class="text-white">
      <rect x="12" y="46" width="6" height="6" />
      <rect x="14" y="47" width="2" height="2" fill="#C2185B" />
      <rect x="14" y="50" width="2" height="2" fill="#C2185B" />
    </g>

    <!-- M -->
    <g class="text-white">
      <rect x="20" y="46" width="7" height="6" />
      <rect x="22" y="48" width="1" height="4" fill="#C2185B" />
      <rect x="24" y="48" width="1" height="4" fill="#C2185B" />
    </g>

    <!-- E -->
    <g class="text-white">
      <rect x="29" y="46" width="5" height="6" />
      <rect x="31" y="47" width="3" height="1" fill="#C2185B" />
      <rect x="31" y="50" width="3" height="1" fill="#C2185B" />
    </g>

    <!-- D -->
    <g class="text-white">
      <rect x="36" y="46" width="6" height="6" />
      <rect x="38" y="48" width="2" height="2" fill="#C2185B" />
      <rect x="41" y="46" width="1" height="1" fill="#C2185B" />
      <rect x="41" y="51" width="1" height="1" fill="#C2185B" />
    </g>

    <!-- E -->
    <g class="text-white">
      <rect x="44" y="46" width="5" height="6" />
      <rect x="46" y="47" width="3" height="1" fill="#C2185B" />
      <rect x="46" y="50" width="3" height="1" fill="#C2185B" />
    </g>

    <!-- V -->
    <g class="text-white">
      <rect x="51" y="46" width="2" height="4" />
      <rect x="57" y="46" width="2" height="4" />
      <rect x="53" y="49" width="2" height="2" />
      <rect x="55" y="49" width="2" height="2" />
      <rect x="54" y="51" width="2" height="1" />
    </g>
  </g>

  <!-- ==================== CLUB BANNER ==================== -->
  <g id="banner-club">
    <!-- C -->
    <g class="text-white">
      <rect x="19" y="55" width="5" height="6" />
      <rect x="21" y="57" width="3" height="2" fill="#C2185B" />
    </g>

    <!-- L -->
    <g class="text-white">
      <rect x="26" y="55" width="2" height="6" />
      <rect x="28" y="59" width="3" height="2" />
    </g>

    <!-- U -->
    <g class="text-white">
      <rect x="33" y="55" width="5" height="6" />
      <rect x="35" y="55" width="1" height="4" fill="#C2185B" />
    </g>

    <!-- B -->
    <g class="text-white">
      <rect x="40" y="55" width="6" height="6" />
      <rect x="42" y="56" width="2" height="1" fill="#C2185B" />
      <rect x="42" y="58" width="2" height="1" fill="#C2185B" />
      <rect x="45" y="55" width="1" height="1" fill="#C2185B" />
      <rect x="45" y="60" width="1" height="1" fill="#C2185B" />
    </g>
  </g>
</svg>
