    <g fill="#FFFFFF">
      <rect x="11" y="41" width="5" height="1" />
      <rect x="10" y="41" width="2" height="3" />
      <rect x="10" y="44" width="6" height="1" />
      <rect x="14" y="44" width="2" height="3" />
