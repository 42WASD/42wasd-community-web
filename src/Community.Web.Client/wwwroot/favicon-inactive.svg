<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- 42WASD favicon — INACTIVE/LOADING state. Grey instead of brand pink.
       Shown while the page is booting/hydrating; swapped to the pink
       favicon.svg once the app has loaded. Transparent background. -->
