  <g id="key-w">
    <rect x="4" y="6" width="24" height="13" fill="#8A8A8A" />
    <rect x="4" y="19" width="24" height="5" fill="#8A8A8A" />
    <polygon points="5,19 27,19 24,23 8,23" fill="#5A5A5A" />
    <g fill="#FFFFFF">
      <rect x="8" y="9" width="2" height="5" />
      <rect x="16" y="9" width="2" height="5" />
      <rect x="10" y="13" width="2" height="2" />
      <rect x="14" y="13" width="2" height="2" />
      <rect x="12" y="11" width="2" height="3" />
    </g>
  </g>
