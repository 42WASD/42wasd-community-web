<div class="columns">
  <aside class="column sidebar is-narrow">
    <section class="section">
      <nav class="menu">
        <ul class="menu-list">
          ${Menu}
          <template id="MenuItem">
            <li><a class="${Active}" href="${Url}">${Text}</a></li>
          </template>
        </ul>
      </nav>
    </section>
  </aside>
  <div class="column">
    <section class="section">
      ${Body}

      <div id="notification-area">
        <div>${Error}</div>
      </div>

      <template id="Home">
        <div class="content">
          <h1 class="title">Welcome to the gaming community!</h1>
          <p>Games we play, active servers, upcoming tournaments, and latest news.</p>

          <div class="columns">
            <div class="column">
              <div class="box">
                <p class="heading">Community stats</p>
                <p class="title is-4">${GamesCount} games</p>
                <p class="subtitle is-6">${OnlineNow} players online</p>
                <p class="subtitle is-6">${OpenTournaments} tournaments open</p>
                <p class="subtitle is-6">${MembersCount} members</p>
              </div>
            </div>
            <div class="column">
              <div class="box">
                <p class="heading">Join us</p>
                <p class="subtitle is-6">Come hang out with the community.</p>
                <a class="button is-link" href="https://discord.gg/42wasd">Join Discord</a>
              </div>
            </div>
          </div>

          <h2 class="title is-4">Games we play</h2>
          <table class="table is-fullwidth">
            <thead><tr><th>Name</th><th>Genre</th></tr></thead>
            <tbody>${Games}</tbody>
          </table>

          <h2 class="title is-4">Active servers</h2>
          <table class="table is-fullwidth">
            <thead><tr><th>Server</th><th>Address</th><th>Online</th></tr></thead>
            <tbody>${Servers}</tbody>
          </table>

          <h2 class="title is-4">Upcoming tournaments</h2>
          <table class="table is-fullwidth">
            <thead><tr><th>Name</th><th>Prize</th></tr></thead>
            <tbody>${Tournaments}</tbody>
          </table>

          <h2 class="title is-4">Latest news</h2>
          <table class="table is-fullwidth">
            <thead><tr><th>Title</th><th>Published</th></tr></thead>
            <tbody>${News}</tbody>
          </table>
        </div>
      </template>

      <template id="Games">
        <h1 class="title">Games</h1>
        <table class="table is-fullwidth">
          <thead><tr><th>Name</th><th>Genre</th><th>Description</th></tr></thead>
          <tbody>${Rows}</tbody>
        </table>
      </template>

      <template id="Servers">
        <h1 class="title">Servers</h1>
        <table class="table is-fullwidth">
          <thead><tr><th>Server</th><th>Address</th><th>Online</th><th>Status</th></tr></thead>
          <tbody>${Rows}</tbody>
        </table>
      </template>

      <template id="Tournaments">
        <h1 class="title">Tournaments</h1>
        <table class="table is-fullwidth">
          <thead><tr><th>Name</th><th>Prize</th><th>Starts</th></tr></thead>
          <tbody>${Rows}</tbody>
        </table>
      </template>

      <template id="Members">
        <h1 class="title">Members</h1>
        <table class="table is-fullwidth">
          <thead><tr><th>Username</th><th>Discord</th></tr></thead>
          <tbody>${Rows}</tbody>
        </table>
      </template>

      <template id="About">
        <div class="content">
          <h1 class="title">About</h1>
          <p>Welcome to the 42WASD gaming community. Built with Bolero + Elmish.</p>
        </div>
      </template>

      <template id="SignIn">
        <h1 class="title">Sign in</h1>
        <form onsubmit="${SignIn}">
          <div class="field">
            <label class="label">Username</label>
            <div class="control">
              <input class="input" bind="${Username}" />
            </div>
          </div>
          <div class="field">
            <label class="label">Password</label>
            <div class="control">
              <input class="input" type="password" bind="${Password}" />
            </div>
          </div>
          <div class="field">
            <div class="control">
              <input type="submit" value="Sign in" class="button is-link" />
            </div>
          </div>
          ${ErrorNotification}
        </form>
      </template>

      <template id="AccountSignedIn">
        <h1 class="title">Account</h1>
        <p>
          Signed in as <strong>${Username}</strong>.
          <button class="button" onclick="${SignOut}">Sign out</button>
        </p>
      </template>

      <template id="EmptyData">
        <tr><td colspan="5">Loading...</td></tr>
      </template>

      <template id="ErrorNotification">
        <div class="notification is-warning">
          <button class="delete ${HideClass}" onclick="${Hide}"></button>
          ${Text}
        </div>
      </template>

    </section>
  </div>
</div>
