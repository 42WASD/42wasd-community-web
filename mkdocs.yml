# 42WASD Community Web — MkDocs config, SSOT reading order.
#
# Generated by Copier from 42WASD/template-docs-project.
# Read scripts/docs/README.md (the SSOT technique) before adding content.
site_name: 42WASD Community Web Docs
site_description: Documentation for 42WASD Community Web.
site_author: 42WASD
site_url: https://42WASD.github.io/42wasd-community-web/

# Do not publish runbook source files; they are embedded into the
# Implementation page by the generator.
exclude_docs: |
  implementation/_runbook/

# Repository Integration
repo_name: 42WASD/42wasd-community-web
repo_url: https://github.com/42WASD/42wasd-community-web
edit_uri: edit/main/docs/

# Theme Configuration
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

# >>> nav-autogen (generated) >>>
nav:
- Home: index.md
- Reference Design:
  - Overview: reference-design/index.md
  - I — Understand the system:
    - Overview: reference-design/01-understand-the-system/index.md
    - The one-sentence idea: reference-design/01-understand-the-system/the-one-sentence-idea/index.md
    - The target architecture: reference-design/01-understand-the-system/the-target-architecture/index.md
  - II — Step-by-step implementation:
    - Overview: reference-design/02-step-by-step-implementation/index.md
    - Phase 0 — Create the project repository: reference-design/02-step-by-step-implementation/create-the-project-repository/index.md
    - Phase 1 — Set up the toolchain: reference-design/02-step-by-step-implementation/set-up-the-toolchain/index.md
    - Phase 2 — First deliverable: reference-design/02-step-by-step-implementation/first-deliverable/index.md
- Implementation:
  - Progress: implementation/index.md
# <<< nav-autogen (generated) <<<

# Extra stylesheets
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
  - minify:
      minify_html: true

# Strict link/anchor/orphan validation (Layer 4 of the verification toolkit).
validation:
  nav:
    omitted_files: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
  anchors: warn