# 42WASD Community Web — Deployment.
#
# The Bolero app is a single ASP.NET Core hosted Blazor WASM server: one
# container serves the client assets AND the remoting API. Session/auth uses
# ASP.NET Core cookies; if you scale >1 replicas, see the note at the bottom.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: 42wasd
  namespace: prd-42wasd-admin
  labels:
    app: 42wasd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 42wasd
  template:
    metadata:
      labels:
        app: 42wasd
    spec:
      securityContext:
        # PodSecurity "restricted": run as non-root, no privilege escalation.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Pinned to the immutable digest (not :main tag) to satisfy the
          # Kyverno "prefer-immutable-digest-in-prod" policy. GHCR package is
          # public, so no imagePullSecrets are needed.
          image: ghcr.io/42wasd/42wasd-community-web@sha256:509548b51acc561fd33ef17f79c751cc3148b62b2afa92f6b643dba6c87578c4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            # Numeric UID of the image's `app` user (aspnet:10.0). Required so
            # kubelet can verify the container runs as non-root when the image
            # declares a non-numeric USER.
            runAsUser: 1654
            runAsGroup: 1654
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
          # The remoting API serves JSON from src/Community.Web.Server/data,
          # baked into the image at publish time (read-only at runtime).
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30

# Scaling >1 replica: Blazor interactive uses SignalR and auth uses cookies.
# Either keep replicas: 1 (fine for a community site), or configure a shared
# data-protection key ring + sticky sessions (see phase-18 runbook).