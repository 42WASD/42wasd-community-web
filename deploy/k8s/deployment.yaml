# 42WASD Community Web — Deployment.
#
# The Bolero app is a single ASP.NET Core hosted Blazor WASM server: one
# container serves the client assets AND the remoting API. Session/auth uses
# ASP.NET Core cookies; if you scale >1 replicas, see the note at the bottom.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: 42wasd
  namespace: prd-42wasd-admin
  labels:
    app: 42wasd
spec:
  replicas: 1
  # Single-replica workload backed by a ReadWriteOnce PVC: use Recreate so the
  # old pod fully terminates (releasing the RWO volume) before the new pod
  # starts. The default RollingUpdate creates the replacement first, which
  # deadlocks on the single-node RWO PVC (new pod cannot bind until the old
  # pod releases it). Brief downtime during rollouts is fine for a community
  # site. Data persists on the 42wasd-data PVC.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: 42wasd
  template:
    metadata:
      labels:
        app: 42wasd
    spec:
      securityContext:
        # PodSecurity "restricted": run as non-root, no privilege escalation.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # Recursively chown the /app/data PVC to the app user (uid/gid 1654)
        # so `saveProfile` can write players.json. fsGroup applies group
        # ownership to any volume mounted in the pod.
        fsGroup: 1654
      initContainers:
        # Seed /app/data with the JSON baked into the image (games.json,
        # news.json, players.json, ...). A PVC mount shadows the image's
        # baked-in /app/data, so we copy the defaults in on first start.
        # Uses `cp -n` (no-clobber) so saved players.json survives pod
        # restarts once it exists on the volume.
        - name: seed-data
          image: ghcr.io/42wasd/42wasd-community-web:main
          command:
            - /bin/sh
            - -ec
            - |
              # The baked JSON is at /app/data inside this init container's
              # own image filesystem (not shadowed). Copy into the PVC.
              cp -rn /app/data/. /pvc-data/ || true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            # The PVC is mounted at a path that does NOT shadow the image's
            # baked-in /app/data, so cp can read from /app/data.
            - name: data
              mountPath: /pvc-data
      containers:
        - name: app
          # Uses the mutable :main tag. imagePullPolicy: Always ensures the
          # newest build is pulled on redeploy. GHCR package is public, so no
          # imagePullSecrets are needed.
          image: ghcr.io/42wasd/42wasd-community-web:main
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            # Numeric UID of the image's `app` user (aspnet:10.0). Required so
            # kubelet can verify the container runs as non-root when the image
            # declares a non-numeric USER.
            runAsUser: 1654
            runAsGroup: 1654
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
          volumeMounts:
            # /app/data is the writable data dir (see PVC above). fsGroup: 1654
            # makes it writable by the app user so saveProfile can persist
            # players.json. Seeded on first start by the seed-data initContainer.
            - name: data
              mountPath: /app/data
          # The remoting API serves JSON from src/Community.Web.Server/data,
          # baked into the image at publish time. A PVC (42wasd-data) is now
          # mounted at /app/data so profile saves persist at runtime.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        # Persistent volume for the community site data (players.json etc.).
        # Defined in pvc.yaml (storageClass nvme-fast, 1Gi, RWO). fsGroup: 1654
        # chowns it to the app user so saveProfile can write.
        - name: data
          persistentVolumeClaim:
            claimName: 42wasd-data

# Scaling >1 replica: Blazor interactive uses SignalR and auth uses cookies.
# Either keep replicas: 1 (fine for a community site), or configure a shared
# data-protection key ring + sticky sessions (see phase-18 runbook).