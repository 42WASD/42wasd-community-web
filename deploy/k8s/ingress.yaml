# 42WASD Community Web — Ingress.
# Terminates TLS and routes *.example.com to the 42wasd Service.
# Replace the host + certIssuer with your cluster's values.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 42wasd
  namespace: prd-42wasd-admin
  annotations:
    # Traefik is the cluster ingress controller (meme-site uses it).
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: wasd.42base.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: 42wasd
                port:
                  name: http