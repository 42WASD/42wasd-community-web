# 42WASD Community Web — Ingress.
# Terminates TLS and routes *.example.com to the 42wasd Service.
# Replace the host + certIssuer with your cluster's values.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 42wasd
  annotations:
    kubernetes.io/ingress.class: nginx
    # cert-manager (optional) — adjust to your issuer
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - wasd.example.com
      secretName: 42wasd-tls
  rules:
    - host: wasd.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: 42wasd
                port:
                  name: http