# 42WASD Community Web — PersistentVolumeClaim for the app data dir.
#
# A FRESH disposable PVC ("new tmp pvc", user request 2026-08-30): created
# empty, bound once, and mounted at /app/data. The seed-data initContainer in
# deployment.yaml re-copies the JSON baked into the image on every pod start,
# so a brand-new volume converges to the same state as the old emptyDir.
# 1Gi is ample: the data dir holds a handful of small JSON files.
#
# NOTE: this claim is NOT deleted on rollout — it persists across restarts so
# saved profiles (players.json) survive. Delete it manually if you want a
# truly fresh volume: kubectl -n prd-42wasd-admin delete pvc 42wasd-data-tmp
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: 42wasd-data-tmp
  namespace: prd-42wasd-admin
  labels:
    app: 42wasd
spec:
  # nvme-fast is the tenant workload class in this cluster (same as other
  # tenant data claims). WaitForFirstConsumer binding keeps the PV on the
  # node that runs the pod.
  storageClassName: nvme-fast
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
