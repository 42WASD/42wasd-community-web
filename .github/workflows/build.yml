name: Build & Publish Bolero Image

# Builds the F#/Bolero project (Community.Web.sln) and publishes the server
# image to GHCR so the RKE2 cluster can pull it.
#
# Runs on:
#   - push to main       -> build + push (tag: latest + short-sha)
#   - pull_request       -> build + test only (no push, no registry login)
#   - workflow_dispatch  -> manual build + push

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "site/**"
  pull_request:
  workflow_dispatch:

env:
  # GHCR image path for this repo's owner.
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # 42WASD/42wasd-community-web

# GITHUB_TOKEN can push to GHCR; grant the minimum needed.
permissions:
  contents: read
  packages: write

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (dotnet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Community.Web.sln

      - name: Build (Release)
        run: dotnet build Community.Web.sln -c Release --no-restore

      - name: Run F# unit tests
        run: dotnet test tests/Community.Client.Tests/Community.Client.Tests.fsproj -c Release --no-build

  build-image:
    name: Build & push GHCR image
    # Run after tests pass; only build+push on main (or manual).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max