# Build + push the 42WASD Community Web container image to GHCR.
#
# This is the "specify the repo, it builds and serves" workflow: on push to
# main (or a version tag), GitHub builds the Docker image from the repo's own
# Dockerfile and pushes it to ghcr.io/42wasd/42wasd-community-web. The K8s
# Deployment then rolls out that image — nothing is cloned or built at
# cluster runtime.
name: Build and Push Container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/<repo> must be lowercase, e.g. ghcr.io/42wasd/42wasd-community-web
  IMAGE_NAME: ${{ lower(github.repository) }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max