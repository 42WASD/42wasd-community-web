[project]
name = "42wasd-community-web"
version = "0.1.0"
description = "42WASD Community Web docs: MkDocs + Material, SSOT reading-order manifest, deterministic validation toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.7.0",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Run the SSOT validation suite. conftest.py adds scripts/docs to sys.path.
testpaths = ["tests"]
addopts = "-ra --strict-markers"